version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    image: node:18-alpine
    working_dir: /app
    environment:
      DATABASE_URL: postgres://ops:ops@postgres:5432/ops
      REDIS_URL: redis://redis:6379
      PORT: 4000
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @ops/api dev"
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
  worker:
    image: node:18-alpine
    working_dir: /app
    environment:
      DATABASE_URL: postgres://ops:ops@postgres:5432/ops
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @ops/worker dev"
    depends_on:
      - postgres
      - redis
  web:
    image: node:18-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_DEMO_USER_ID: 00000000-0000-0000-0000-000000000001
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @ops/web dev"
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
