<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🐍 URL Snake Game</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f8ff;
        --card: #ffffff;
        --accent: #5b7cfa;
        --accent-2: #35c46a;
        --text: #101727;
        --muted: #5b6476;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1220;
          --card: #191d31;
          --accent: #8aa0ff;
          --accent-2: #56d786;
          --text: #edf1ff;
          --muted: #b9c2df;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top, #9db3ff33, transparent 45%), var(--bg);
        color: var(--text);
        padding: 1rem;
      }

      .card {
        width: min(94vw, 560px);
        background: var(--card);
        border: 1px solid #b7c2ff33;
        border-radius: 18px;
        padding: 1rem;
        box-shadow: 0 16px 34px #0a10271f;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: .5rem;
        margin-bottom: .75rem;
      }

      h1 {
        font-size: 1.2rem;
        margin: 0;
      }

      .stats {
        display: flex;
        gap: .8rem;
        font-weight: 700;
        color: var(--muted);
      }

      .stats strong { color: var(--text); }

      canvas {
        width: 100%;
        aspect-ratio: 1 / 1;
        display: block;
        border-radius: 14px;
        border: 1px solid #b7c2ff44;
        background: repeating-linear-gradient(
          0deg,
          #6a7aff17,
          #6a7aff17 20px,
          #ffffff00 20px,
          #ffffff00 40px
        ),
        repeating-linear-gradient(
          90deg,
          #6a7aff17,
          #6a7aff17 20px,
          #ffffff00 20px,
          #ffffff00 40px
        );
      }

      .controls {
        margin-top: .9rem;
        display: flex;
        gap: .55rem;
        align-items: center;
        flex-wrap: wrap;
      }

      button {
        padding: .65rem .95rem;
        border-radius: 10px;
        border: none;
        font-weight: 700;
        cursor: pointer;
        background: var(--accent);
        color: white;
      }

      button.secondary { background: #8a93a915; color: var(--text); border: 1px solid #9aa4c13f; }

      .hint {
        margin: 0;
        color: var(--muted);
        font-size: .92rem;
      }

      .dpad {
        margin-top: .9rem;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: .4rem;
        max-width: 210px;
      }

      .dpad button {
        background: #8a93a915;
        color: var(--text);
        border: 1px solid #9aa4c13f;
      }

      .dpad .empty { visibility: hidden; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="top-bar">
        <h1>🐍 URL Snake Game</h1>
        <div class="stats">
          <span>Score: <strong id="score">0</strong></span>
          <span>Best: <strong id="best">0</strong></span>
        </div>
      </div>

      <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>

      <div class="controls">
        <button id="start">Start / Restart</button>
        <button class="secondary" id="speed">Speed: Normal</button>
        <p class="hint" id="status">Use arrow keys, WASD, or buttons. Eat URLs: .com, .dev, .io 🍎</p>
      </div>

      <div class="dpad" aria-label="Touch controls">
        <span class="empty">·</span>
        <button data-dir="up">⬆️</button>
        <span class="empty">·</span>
        <button data-dir="left">⬅️</button>
        <button data-dir="down">⬇️</button>
        <button data-dir="right">➡️</button>
      </div>
    </main>

    <script>
      const gridSize = 20;
      const tileCount = 20;
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');

      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const statusEl = document.getElementById('status');
      const speedBtn = document.getElementById('speed');

      const urlBits = ['.com', '.dev', '.io', '.app', '.ai', '.net'];
      const speeds = [140, 100, 75];
      const speedNames = ['Normal', 'Fast', 'Turbo'];

      let speedMode = 0;
      let loop;
      let snake;
      let direction;
      let queuedDirection;
      let food;
      let score;
      let best = Number(localStorage.getItem('snake-best') || 0);

      bestEl.textContent = best;

      function randomTile() {
        return Math.floor(Math.random() * tileCount);
      }

      function spawnFood() {
        do {
          food = {
            x: randomTile(),
            y: randomTile(),
            label: urlBits[Math.floor(Math.random() * urlBits.length)]
          };
        } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
      }

      function setDirection(dir) {
        const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
        if (opposites[direction] !== dir) {
          queuedDirection = dir;
        }
      }

      function startGame() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];
        direction = 'right';
        queuedDirection = 'right';
        score = 0;
        scoreEl.textContent = score;
        statusEl.textContent = 'Game on! Grab as many URL bites as you can.';

        spawnFood();
        clearInterval(loop);
        loop = setInterval(tick, speeds[speedMode]);
        draw();
      }

      function gameOver() {
        clearInterval(loop);
        if (score > best) {
          best = score;
          localStorage.setItem('snake-best', String(best));
          bestEl.textContent = best;
        }
        statusEl.textContent = `Game over at ${score}. Press Start / Restart to play again!`;
      }

      function tick() {
        direction = queuedDirection;

        const head = { ...snake[0] };
        if (direction === 'up') head.y -= 1;
        if (direction === 'down') head.y += 1;
        if (direction === 'left') head.x -= 1;
        if (direction === 'right') head.x += 1;

        if (
          head.x < 0 || head.x >= tileCount ||
          head.y < 0 || head.y >= tileCount ||
          snake.some(seg => seg.x === head.x && seg.y === head.y)
        ) {
          gameOver();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 1;
          scoreEl.textContent = score;
          statusEl.textContent = `Yum ${food.label}! Keep going...`;
          spawnFood();
        } else {
          snake.pop();
        }

        draw();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const segment of snake) {
          ctx.fillStyle = '#5b7cfa';
          ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
        }

        const head = snake[0];
        ctx.fillStyle = '#35c46a';
        ctx.fillRect(head.x * gridSize, head.y * gridSize, gridSize - 2, gridSize - 2);

        ctx.fillStyle = '#ff5678';
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

        ctx.fillStyle = '#ffffff';
        ctx.font = '12px ui-sans-serif';
        ctx.fillText(food.label, food.x * gridSize + 2, food.y * gridSize + 13);
      }

      document.addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        if (['arrowup', 'w'].includes(key)) setDirection('up');
        if (['arrowdown', 's'].includes(key)) setDirection('down');
        if (['arrowleft', 'a'].includes(key)) setDirection('left');
        if (['arrowright', 'd'].includes(key)) setDirection('right');
      });

      document.querySelectorAll('.dpad button').forEach(button => {
        button.addEventListener('click', () => setDirection(button.dataset.dir));
      });

      document.getElementById('start').addEventListener('click', startGame);

      speedBtn.addEventListener('click', () => {
        speedMode = (speedMode + 1) % speeds.length;
        speedBtn.textContent = `Speed: ${speedNames[speedMode]}`;
        if (loop) {
          clearInterval(loop);
          loop = setInterval(tick, speeds[speedMode]);
        }
      });

      startGame();
    </script>
  </body>
</html>
